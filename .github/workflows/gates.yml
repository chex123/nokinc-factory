name: gates

on:
  pull_request:
  push: {branches: [main]}

permissions:
  contents: read

jobs:
  deterministic-gates:
    name: deterministic-gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: factory_test
          # Disposable CI-only database, isolated to the ephemeral job network.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FACTORY_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/factory_test
      FACTORY_TEST_WORKER_URL: postgresql+psycopg://factory_worker@localhost:5432/factory_test
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,phase1,phase2]"
      - name: Create non-owner PostgreSQL test role
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["FACTORY_TEST_DATABASE_URL"])
          with engine.begin() as connection:
            connection.execute(text(
                "CREATE ROLE factory_worker LOGIN "
              "NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"
            ))
          PY
      - name: build
        run: python -m compileall -q src scripts
      - name: types
        run: mypy --strict src scripts/deploy_pilot.py
      - name: lint
        run: ruff check src tests scripts
      - name: unit
        run: python -m pytest tests/unit -q
      - name: acceptance
        run: python -m pytest tests/acceptance -q
      - name: diff_coverage
        if: github.event_name == 'pull_request'
        run: |
          python -m pytest --cov=src --cov-report=xml -q
          diff-cover coverage.xml --compare-branch="origin/${{ github.base_ref }}" --fail-under=90
      - name: secret_scan
        shell: bash
        run: |
          pip install detect-secrets
          if [ -f .secrets.baseline ]; then
            # scan --baseline UPDATES the baseline; it is not a blocking gate.
            # The hook compares candidates against the reviewed baseline and exits non-zero.
            git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
          else
            detect-secrets scan > /tmp/scan.json
            python - <<'PY'
          import json, sys
          results = json.load(open('/tmp/scan.json')).get('results', {})
          for path, hits in results.items():
              for h in hits:
                  print(f"::error file={path},line={h['line_number']}::potential secret ({h['type']})")
          sys.exit(1 if results else 0)
          PY
          fi
      - name: dependency_scan
        run: pip install pip-audit && pip-audit . --strict

  frozen-contract:
    name: frozen-contract
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: enforce frozen path separation
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=50
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
          FROZEN='^(tests/acceptance/|tests/contract/|tests/regression/|tests/fixtures/|features/|step_definitions/)'
          FROZEN_CHANGED=$(echo "$CHANGED" | grep -E "$FROZEN" || true)
          OUTSIDE_CHANGED=$(echo "$CHANGED" | grep -vE "$FROZEN" || true)

          if [ -n "$FROZEN_CHANGED" ] && [ -n "$OUTSIDE_CHANGED" ]; then
            echo "::error::Frozen test-contract changes cannot be mixed with implementation or control-plane changes."
            echo "$OUTSIDE_CHANGED" | while read -r f; do
              [ -n "$f" ] && echo "::error file=$f::outside frozen-contract allowlist"
            done
            exit 1
          fi

          if [ -n "$FROZEN_CHANGED" ] && ! echo "$FROZEN_CHANGED" | grep -qE '^(tests/acceptance/|features/)'; then
            echo "::error::A frozen contract change must add executable acceptance behavior."
            exit 1
          fi

  baseline-assertion:
    name: baseline-assertion
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: capture candidate and true-baseline test identities
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=50
          BASE_SHA="$(git rev-parse "origin/${{ github.base_ref }}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          FROZEN='^(tests/acceptance/|tests/contract/|tests/regression/|tests/fixtures/|features/|step_definitions/)'
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          FROZEN_CHANGED=$(echo "$CHANGED" | grep -E "$FROZEN" || true)
          if [ -z "$FROZEN_CHANGED" ]; then
            echo "NOT_APPLICABLE: no frozen test-contract paths changed."
            exit 0
          fi
          RUNNER_DIGEST="sha256:$(sha256sum .github/workflows/gates.yml | awk '{print $1}')"
          ENVIRONMENT_DIGEST="sha256:$(printf '%s\n' "$(python --version)" "$(pytest --version)" "$(git --version)" | sha256sum | awk '{print $1}')"
          BASE_DIR="/tmp/factory-base-${{ github.run_id }}"
          mkdir -p /tmp/factory-evidence /tmp/frozen
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          trap 'git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true' EXIT
          TEST_PATH_ARGS=()
          TEST_PATHS=()
          for p in tests/acceptance tests/contract tests/regression tests/fixtures features step_definitions; do
            if [ -e "$p" ]; then
              TEST_PATH_ARGS+=(--path "$p")
              TEST_PATHS+=("$p")
              mkdir -p "/tmp/frozen/$(dirname "$p")"
              cp -a "$p" "/tmp/frozen/$p"
            fi
          done
          python -m nokinc_factory.adapters.pytest_evidence collect \
            --root . --output /tmp/factory-evidence/pr-inventory.json \
            --binding-output /tmp/factory-evidence/pr-binding.json \
            --work-item-id "pr-${{ github.event.pull_request.number }}" \
            --source-sha "$HEAD_SHA" --runner-digest "$RUNNER_DIGEST" \
            --environment-digest "$ENVIRONMENT_DIGEST" \
            --run-id "collect-pr-${{ github.run_id }}" "${TEST_PATH_ARGS[@]}"

          pip install -e ".[dev]"
          python -m nokinc_factory.adapters.pytest_evidence collect \
            --root "$BASE_DIR" --output /tmp/factory-evidence/base-inventory.json \
            --binding-output /tmp/factory-evidence/base-binding.json \
            --work-item-id "pr-${{ github.event.pull_request.number }}" \
            --source-sha "$BASE_SHA" --runner-digest "$RUNNER_DIGEST" \
            --environment-digest "$ENVIRONMENT_DIGEST" \
            --run-id "collect-base-${{ github.run_id }}" "${TEST_PATH_ARGS[@]}"
          (
            cd "$BASE_DIR"
            PYTHONPATH="$GITHUB_WORKSPACE/src${PYTHONPATH:+:$PYTHONPATH}" \
              python -m nokinc_factory.adapters.pytest_probe \
                --binding /tmp/factory-evidence/base-binding.json \
                --report /tmp/factory-evidence/base-run.json -- \
                "${TEST_PATHS[@]}" -q
          )

          for p in tests/acceptance tests/contract tests/regression tests/fixtures features step_definitions; do
            if [ -e "/tmp/frozen/$p" ]; then
              rm -rf "$BASE_DIR/$p"
              mkdir -p "$BASE_DIR/$(dirname "$p")"
              cp -a "/tmp/frozen/$p" "$BASE_DIR/$p"
            fi
          done
          python -m nokinc_factory.adapters.pytest_evidence collect \
            --root "$BASE_DIR" --output /tmp/factory-evidence/frozen-inventory.json \
            --binding-output /tmp/factory-evidence/frozen-binding.json \
            --work-item-id "pr-${{ github.event.pull_request.number }}" \
            --source-sha "$BASE_SHA" --runner-digest "$RUNNER_DIGEST" \
            --environment-digest "$ENVIRONMENT_DIGEST" \
            --run-id "collect-frozen-${{ github.run_id }}" "${TEST_PATH_ARGS[@]}"
          (
            cd "$BASE_DIR"
            PYTHONPATH="$GITHUB_WORKSPACE/src${PYTHONPATH:+:$PYTHONPATH}" \
              python -m nokinc_factory.adapters.pytest_probe \
                --binding /tmp/factory-evidence/frozen-binding.json \
                --report /tmp/factory-evidence/frozen-on-baseline.json -- \
                "${TEST_PATHS[@]}" -q
          )
          python -m nokinc_factory.adapters.pytest_evidence contract \
            --baseline /tmp/factory-evidence/base-inventory.json \
            --frozen /tmp/factory-evidence/frozen-inventory.json \
            --story-kind NEW_BEHAVIOR \
            --output /tmp/factory-evidence/baseline-contract.json
          python -m nokinc_factory.cli verify-tests baseline \
            --contract /tmp/factory-evidence/baseline-contract.json \
            --before /tmp/factory-evidence/base-run.json \
            --run /tmp/factory-evidence/frozen-on-baseline.json
          echo "Structured baseline evidence passed: old suite green and only declared new assertions red."
