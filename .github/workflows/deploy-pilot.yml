name: deploy-pilot

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Unique immutable tag for this Factory source revision
        required: true
        type: string
      model_turn_limit:
        description: Optional cumulative tenant turn limit (positive integer or unlimited); blank preserves
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pilot-factory-deployment
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install verified toolchain
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy --strict src scripts/deploy_pilot.py
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Frozen acceptance
        run: python -m pytest tests/acceptance -q
      - name: Dependency audit
        run: pip-audit . --strict

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pilot-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Configure short-lived AWS role
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          role-to-assume: ${{ vars.AWS_PILOT_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: factory-pilot-${{ github.run_id }}
      - name: Build, scan, and promote immutable digest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          MODEL_TURN_LIMIT: ${{ inputs.model_turn_limit }}
        shell: bash
        run: |
          deploy_args=(python scripts/deploy_pilot.py --tag "$IMAGE_TAG" --engine docker)
          if [[ -n "$MODEL_TURN_LIMIT" ]]; then
            deploy_args+=(--chat-model-turn-limit "$MODEL_TURN_LIMIT")
          fi
          "${deploy_args[@]}"